services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mathsite-postgres
    environment:
      POSTGRES_DB: mathsite
      POSTGRES_USER: mathsite
      POSTGRES_PASSWORD: mathsite_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathsite -d mathsite"]
      interval: 3s
      timeout: 3s
      retries: 20
